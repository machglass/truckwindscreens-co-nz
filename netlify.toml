# Netlify config for the rebuilt truckwindscreens.co.nz (plain static site, no build step)
[build]
  publish = "."
  command = ""

# Force the apex domain (the original WordPress site used https://truckwindscreens.co.nz/)
[[redirects]]
  from = "https://www.truckwindscreens.co.nz/*"
  to = "https://truckwindscreens.co.nz/:splat"
  status = 301
  force = true

# Old WordPress URLs -> new clean URLs
